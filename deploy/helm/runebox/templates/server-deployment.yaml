{{- if .Values.server.enabled -}}
{{- $serverSA := default (default (printf "%s-server" (include "runebox.fullname" .)) .Values.serviceAccount.name) .Values.serviceAccount.server.name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runebox.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "runebox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "runebox.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $serverSA }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: {{ include "runebox.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --bind=0.0.0.0
            - --port={{ .Values.server.port }}
            {{- if .Values.server.tls.enabled }}
            - --tls-cert=/etc/runebox/tls/tls.crt
            - --tls-key=/etc/runebox/tls/tls.key
            {{- else }}
            - --allow-insecure-http
            {{- end }}
            {{- if .Values.server.noUI }}
            - --no-ui
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          env:
            - name: RUNEBOX_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RUNEBOX_CONFIG_DIR
              value: /etc/runebox/profiles
            - name: RUNEBOX_STATE_DIR
              value: {{ .Values.stateDir | quote }}
            - name: RUNEBOX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "runebox.serverTokenSecretName" . }}
                  key: {{ .Values.server.auth.tokenKey }}
            - name: RUNEBOX_EGRESS_IMAGE
              value: {{ include "runebox.egressImage" . | quote }}
            {{- with include "runebox.directVolumeClass" . }}
            - name: RUNEBOX_K8S_DIRECT_VOLUME_CLASS
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.server.tls.enabled }}
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: profiles
              mountPath: /etc/runebox/profiles
              readOnly: true
            - name: state
              mountPath: {{ .Values.stateDir }}
            {{- if .Values.server.tls.enabled }}
            - name: tls
              mountPath: /etc/runebox/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: profiles
          {{- include "runebox.profilesVolume" . | nindent 10 }}
        - name: state
          emptyDir: {}
        {{- if .Values.server.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "runebox.serverTLSSecretName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runebox.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runebox.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "runebox.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
{{- end }}
