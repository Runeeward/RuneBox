# A minimal Kubernetes-backed profile. Used by the declarative CRD/controller
# flow and the k8s backend walkthrough in docs/E2E-TESTING.md.
#
#   ./bin/runebox up
#   kubectl -n runebox create configmap runebox-profiles --from-file=examples/
#   kubectl apply -f - <<'EOF'
#   apiVersion: runebox.runeward.io/v1alpha1
#   kind: Sandbox
#   metadata: { name: demo, namespace: runebox }
#   spec: { profile: k8s }
#   EOF

[host]
type    = "k8s"
image   = "debian:stable-slim"
workdir = "/workspace"

[rationing]
max_execs = 100
